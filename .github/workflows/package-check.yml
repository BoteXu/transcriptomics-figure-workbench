name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check skill, public catalog, links and asset integrity
        run: python tests/check_package.py
  frozen-plotting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare the explicitly scoped plotting test environment
        run: python -m pip install -r requirements.txt -r requirements-review.txt
      - name: Check synthetic contracts, cross-panel identity and theme replacement
        env:
          MPLBACKEND: Agg
        run: |
          python tests/check_color_cards.py
          python tests/check_increment_runtime.py
          python tests/check_matrix_flexibility.py
          python tests/check_linked_runtime.py
          python tests/check_flow_alignment.py
          python tests/check_guide_spacing.py
          python tests/check_biomni_views.py
          python tests/check_analysis_results.py
