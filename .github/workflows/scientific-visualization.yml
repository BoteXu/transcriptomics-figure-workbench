name: Scientific visualization public source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-display-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      BIORESEARCH_SOURCE_ROOT: .ci-workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/scientific-visualization/requirements.txt
      - name: Check exact public source and frozen export hashes
        run: python tools/check_scientific_release.py
      - name: Select exact public workbench source contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BoteXu/BioResearchWorkbench
          ref: f7ae0a3604a2436956149973d1015982d808b139
          path: .ci-workbench
          persist-credentials: false
      - name: Install scoped plotting test dependencies
        run: python -m pip install --disable-pip-version-check -r skills/scientific-visualization/requirements.txt
      - name: Exercise actual result consumers and rejection cases
        run: python -m unittest discover -s tests -p 'test_scientific*.py'
