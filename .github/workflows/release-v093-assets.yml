name: Prepare reviewed v0.9.3 draft assets
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed 40-character commit on the v0.9.3 tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check exact source and the public artifact ledger
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          source=os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[a-f0-9]{40}',source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          PY
          python tests/check_v090_release.py
          python tests/check_rich_release.py
          python tests/check_chapter_release.py
          python tests/check_chapter_contracts.py
          python tests/check_selection_depth.py
          python tests/check_editorial_release.py
          python tests/check_source_release.py
          python tests/check_package.py
          python tools/build_release.py --output release-assets > release-build.json
      - name: Upload missing assets to the exact draft and verify their digests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os,json,subprocess,hashlib
          from pathlib import Path
          def gh(*args):return subprocess.check_output(['gh',*args],text=True)
          repo=os.environ['GH_REPO'];tag='v0.9.3'
          ref=json.loads(gh('api','repos/'+repo+'/git/ref/tags/'+tag))['object']
          if ref['type']=='tag':ref=json.loads(gh('api','repos/'+repo+'/git/tags/'+ref['sha']))['object']
          assert ref['type']=='commit' and ref['sha']==os.environ['EXPECTED_SOURCE']
          release=json.loads(gh('release','view',tag,'--json','databaseId,isDraft,tagName'))
          assert release['isDraft'] and release['tagName']==tag
          endpoint='repos/'+repo+'/releases/'+str(release['databaseId'])
          current=json.loads(gh('api',endpoint));present={a['name']:a for a in current['assets']}
          local={p.name:p for p in Path('release-assets').iterdir() if p.is_file()}
          assert set(present)<=set(local) and all(a['state']=='uploaded' for a in present.values())
          uploaded={}
          for name,path in sorted(local.items()):
              if name not in present:
                  gh('release','upload',tag,str(path));uploaded[name]=hashlib.sha256(path.read_bytes()).hexdigest()
          final=json.loads(gh('api',endpoint));assets={a['name']:a for a in final['assets']}
          assert set(assets)==set(local) and all(a['state']=='uploaded' for a in assets.values())
          for name,digest in uploaded.items():assert assets[name]['digest']=='sha256:'+digest
          checksum=Path('release-assets/SHA256SUMS-v0.9.3.txt')
          checksum.write_text(''.join(a['digest'].removeprefix('sha256:')+'  '+name+'\n' for name,a in sorted(assets.items()) if name!=checksum.name))
          gh('release','upload',tag,str(checksum),'--clobber')
          Path('release-preparation.json').write_text(json.dumps(dict(status='SOURCE_BOUND_DRAFT_COMPLETE',source_commit=os.environ['EXPECTED_SOURCE'],assets=[dict(name=a['name'],size=a['size'],digest=a['digest']) for a in assets.values()]),indent=2)+'\n')
          print('Exact-source draft assets complete; publication remains a separate action')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-v093-preparation
          path: |
            release-build.json
            release-preparation.json
