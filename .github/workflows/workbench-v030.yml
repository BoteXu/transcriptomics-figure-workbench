name: Workbench acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify dependency-free contracts and generated references
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/sync_renderer_registry.py --check
          python tests/check_workbench.py
          python tests/check_design_workflow.py
          python tests/check_review_update.py
          python tests/check_review_v060.py
          python tests/check_clarity_release.py
          python tests/check_forms_release.py
          python tests/check_flexible_layout.py
          python tests/check_responsive_release.py
          python tests/check_v090_release.py
          python tests/check_rich_release.py
          python tests/check_chapter_release.py
          python tests/check_chapter_contracts.py
          python tests/check_selection_depth.py
          python tests/check_companion_catalog.py
          python tests/check_private_profile_sync.py
          python tools/build_journal_review.py --check
          python tests/check_editorial_release.py
          python tests/check_source_release.py
          python skills/transcriptomics-figure-workbench/scripts/workbench.py methods --search GSEA
          python skills/transcriptomics-figure-workbench/scripts/render_frozen_table.py --help
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-review.txt
      - name: Render frozen fixtures and verify output/review behavior
        run: python tests/check_workbench_runtime.py workbench-ci
      - name: Check variable-data single-figure layouts
        run: python tests/check_responsive_layout.py responsive-ci
      - name: Check study routing, independent units and repaired layout regressions
        run: |
          python tests/check_study_figures.py
          python tests/check_routine_study.py
          python tests/check_routine_gallery.py
          python tests/check_publication_defaults.py
          python tests/check_layout_depth_v090.py
          python tests/check_rich_defaults.py
          python tests/check_method_depth.py
          python tests/check_analysis_completion.py
          python tests/check_companion_runtime.py
          python tests/check_companion_fixture_semantics.py
          python tests/check_subgroup_markers.py
          python tests/check_editorial_runtime.py examples/editorial-v092
          python tests/check_source_runtime.py
      - name: Exercise ordinary requests on two coherent fictional result packages
        run: |
          python tools/build_transcriptomic_study_examples.py --output study-ci-fixtures
          python tools/render_study_examples.py --fixtures study-ci-fixtures
      - name: Render redesigned and expanded display modes; verify scientific encodings
        run: |
          python tools/build_aesthetic_redesign.py --output aesthetic-ci
          python tests/check_aesthetic_grammar.py aesthetic-ci
          python tools/build_method_figures.py --output method-ci
          python tests/check_method_entries.py method-ci
          python tools/build_package_gallery.py --output package-ci
          python tests/check_package_styles.py package-ci
          python tests/check_package_styles.py examples/package-v040
          python tests/check_design_runtime.py design-ci
          python tests/check_refined_runtime.py
          python tests/check_clarity_runtime.py
          python tests/check_reading.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workbench-frozen-previews
          path: |
            workbench-ci
            study-ci-fixtures
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare pinned isolated browser for synthetic UI checks
        run: |
          npm install --prefix .ci/deps --ignore-scripts playwright@1.62.1
          .ci/deps/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Check offline Studio in a real browser
        env:
          FIGURE_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.ci/deps/node_modules/playwright/index.mjs
        run: |
          python skills/transcriptomics-figure-workbench/scripts/workbench.py studio --output .ci/studio.html --gallery examples/gallery --demo-svg examples/workbench-v030/WB_ma/WB_ma.svg
          node tests/check_publication_browser.mjs publication-browser-ci .ci/studio.html
          node tests/check_clarity_browser.mjs clarity-browser-ci
          node tests/check_forms_browser.mjs forms-browser-ci
          node tests/check_v090_browser.mjs v090-browser-ci
          node tests/check_chapter_browser.mjs chapter-browser-ci
          node tests/check_dedicated_browser.mjs dedicated-browser-ci
          node tests/check_source_browser.mjs source-browser-ci
          node tests/check_routine_browser.mjs routine-browser-ci
          node tests/check_analysis_browser.mjs analysis-browser-ci
          node tests/check_companion_browser.mjs companion-browser-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-browser-receipts
          path: |
            publication-browser-ci
            routine-browser-ci
            forms-browser-ci
            v090-browser-ci
            companion-browser-ci
