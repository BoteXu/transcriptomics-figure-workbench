function update(){const filtered=rows.filter(x=>(!assay.value||(x.assay===assay.value||x.assays.includes(assay.value)))&&JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase()));page=Math.min(page,Math.max(0,Math.ceil(filtered.length/4)-1));const main=document.querySelector('#cards');main.replaceChildren();for(const r of filtered.slice(page*4,page*4+4)){const card=el('article');card.dataset.id=r.id;card.append(el('h2',r.title),el('div',r.id+' · '+r.assay+' · 屏幕自检 / 非科学验收'));const image=el('img');image.src=r.assets.preview;image.alt=r.title;image.loading='lazy';image.onclick=()=>{document.querySelector('#large').src=r.assets.png;document.querySelector('#zoom').showModal()};card.append(image);for(const key of ['png','svg','pdf','tsv','spec']){const a=el('a',key.toUpperCase());a.href=r.assets[key];a.target='_blank';a.rel='noopener';card.append(a)}const d=el('details');d.append(el('summary','输入、来源与使用范围'));d.append(el('p','需要的冻结结果：'+r.required_results.join('；')),el('p',r.specific_qc_and_limit));for(const url of r.sources){const a=el('a','作者来源');a.href=url;a.target='_blank';a.rel='noopener';d.append(a)}card.append(d);main.append(card)}document.querySelector('#count').textContent=filtered.length+'个章节 · 第'+(page+1)+'页 / '+Math.max(1,Math.ceil(filtered.length/4));document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*4>=filtered.length}
q.oninput=assay.onchange=()=>{page=0;update()};document.querySelector('#prev').onclick=()=>{page--;update()};document.querySelector('#next').onclick=()=>{page++;update()};document.querySelector('#close').onclick=()=>document.querySelector('#zoom').close();update();</script></html>
