<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>科研图型 · 基础与扩展</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f5;color:#283740;font:15px system-ui,sans-serif}header{padding:36px max(5vw,20px) 22px;background:#fff;border-bottom:1px solid #dbe4e5}h1{font-size:28px;letter-spacing:-.6px;margin:0 0 12px}p{line-height:1.7;max-width:1000px}a{color:#177c7e}nav{display:flex;gap:12px;padding:18px max(5vw,20px);position:sticky;top:0;background:#f2f5f5ef;z-index:1;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;padding:9px 12px;border:1px solid #bccdd1;border-radius:6px;background:white;color:inherit}button{cursor:pointer}input{width:min(400px,85vw)}#count{margin-left:auto;font-size:13px;color:#65777d}main{padding:0 max(5vw,20px) 35px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}article{background:white;border:1px solid #dce5e6;border-radius:10px;padding:18px;min-width:0}h2{font-size:18px;margin:0 0 12px}article img{display:block;width:100%;height:260px;object-fit:contain;margin:10px 0}article select{width:100%;margin-top:8px}.small{font-size:12px;color:#65777d}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}dialog{border:0;border-radius:10px;width:96vw;max-width:none;height:94vh;max-height:none;padding:0;background:white}dialog::backdrop{background:#22303fbb}.toolbar{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid #dce5e6;flex-wrap:wrap}.toolbar strong{margin-right:auto}#imageview{height:calc(94vh - 150px);overflow:auto;padding:18px}#imageview img{display:block;max-width:100%;max-height:100%;object-fit:contain;margin:auto}#imageview.native img{max-width:none;max-height:none;margin:0}#detail{padding:8px 20px;font-size:12px;color:#65777d;line-height:1.6}details{margin-top:10px}summary{cursor:pointer;color:#65777d;font-size:12px}@media(max-width:600px){header{padding:24px 20px}h1{font-size:23px}#count{margin-left:0}}
</style><header><h1>先选图型，再选扩展</h1><p>相近画法合并展示。分组、注释、转置、边际分布和拼版作为扩展；仅更换数据或配色的示例归入同一扩展。原编号可直接检索。每张图保留自己的尺度、单位、上下文和来源。</p><p class="small">本轮覆盖全部 458 个既有导出；没有新增独立图型。屏幕检查、目标印刷尺寸和科学有效性分别记录。</p></header>
<nav><input id="search" type="search" aria-label="检索图型或原编号" placeholder="热图、GSEA、火山图、原编号…"><select id="filter" aria-label="目录范围"><option value="forms">基础图型</option><option value="composition">组合图</option><option value="reference">配色与结构参考</option><option value="all">全部基础条目</option></select><span id="count" role="status"></span></nav><main id="gallery"></main>
<dialog id="viewer"><div class="toolbar"><strong id="title"></strong><button id="before">原版 / 当前</button><button id="native">原像素 / 适合窗口</button><button id="close">关闭</button></div><div id="imageview"></div><div id="detail"></div></dialog>
<script>
const DATA=/*FORM_DATA*/{};const $=id=>document.getElementById(id);let active=null,old=false;
function image(src,alt){const n=document.createElement('img');n.src=src;n.alt=alt;n.loading='lazy';return n;}
function a(href,text){const n=document.createElement('a');n.href=href;n.textContent=text;return n;}
function show(e,g){active={e,g};old=false;$('viewer').showModal();paint();}
function paint(){const {e,g}=active;$('title').textContent=g.title+' · '+e.id+(old?' · 历史版':'');$('imageview').replaceChildren(image(old?e.previous_png:e.png,e.id));$('before').disabled=!e.previous_png;$('detail').textContent=e.review_note+' 目标尺寸见独立记录；此处不构成印刷或科学验收。';
 for(const id of e.components||[]){const family=DATA.forms.find(f=>f.compatibility_aliases.includes(id));if(!family)continue;const source=family.extensions.find(x=>x.id===id),b=document.createElement('button');b.textContent='独立面板 '+id;b.onclick=()=>show(source,family);$('detail').append(b);}}
function refresh(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const groups=DATA.forms.filter(g=>(f==='all'||f==='composition'&&g.id==='composition'||f==='reference'&&['palettes','structures'].includes(g.id)||f==='forms'&&!['composition','palettes','structures'].includes(g.id))&&JSON.stringify([g.title,g.id,g.compatibility_aliases,g.variants]).toLowerCase().includes(q));$('gallery').replaceChildren();$('count').textContent=groups.length+' 个条目 · '+DATA.counts.retained_examples+' 份可追溯示例';
 for(const g of groups){const card=document.createElement('article');card.dataset.form=g.id;const h=document.createElement('h2');h.textContent=g.title;card.append(h);const v=document.createElement('select');v.setAttribute('aria-label',g.title+'扩展');for(const x of g.variants){const o=document.createElement('option');o.value=x.id;o.textContent=x.label;v.append(o);}v.value=g.default_variant;
  const preview=document.createElement('button');preview.style.cssText='border:0;padding:0;background:white;width:100%';preview.setAttribute('aria-label','查看 '+g.title);const info=document.createElement('p');info.className='small';const links=document.createElement('div');links.className='links';const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='示例来源与兼容编号';details.append(summary);const samples=document.createElement('select');samples.setAttribute('aria-label',g.title+'示例来源');details.append(samples);let current;
  function draw(k){current=g.extensions.find(e=>e.id===k);preview.replaceChildren(image(current.png,g.title+' '+current.id));preview.onclick=()=>show(current,g);links.replaceChildren();for(const ext of ['svg','pdf','meta','table'])if(current.links[ext])links.append(a(current.links[ext],{svg:'SVG',pdf:'PDF',meta:'来源记录',table:'绘图表'}[ext]));info.textContent='当前示例 '+current.id+' · '+g.variants.length+' 种表达扩展。数据示例不计为新图型。';}
  function choose(){const x=g.variants.find(x=>x.id===v.value);samples.replaceChildren();for(const id of x.example_ids){const e=g.extensions.find(e=>e.id===id),o=document.createElement('option');o.value=id;o.textContent=id+' · '+e.label;samples.append(o);}samples.value=x.preferred_example;draw(samples.value);}
  v.onchange=choose;samples.onchange=()=>draw(samples.value);card.append(v,preview,info,links,details);choose();$('gallery').append(card);
 }
}
$('search').oninput=refresh;$('filter').onchange=refresh;$('close').onclick=()=>$('viewer').close();$('before').onclick=()=>{old=!old;paint();};$('native').onclick=()=>$('imageview').classList.toggle('native');
function openAlias(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;const g=DATA.forms.find(g=>g.id===id||g.compatibility_aliases.includes(id));if(g){$('filter').value='all';$('search').value=g.title;refresh();show(g.extensions.find(e=>e.id===id)||g.extensions.find(e=>e.id===g.default),g);}}
refresh();openAlias();window.addEventListener('hashchange',openAlias);
</script></html>
