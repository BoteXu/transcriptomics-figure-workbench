<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Figure review library</title>
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#243449;background:#eef2f4}*{box-sizing:border-box}body{margin:0}header{padding:36px max(24px,5vw) 20px;background:white}h1{font-size:30px;font-weight:650;margin:0 0 10px}p{line-height:1.6}header p{max-width:980px;color:#66778a}nav{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#ffffffee;padding:15px 5vw;z-index:2;border-bottom:1px solid #dbe3e9}input,select,button{font:inherit;border:1px solid #cbd5de;border-radius:6px;padding:9px 12px;background:white;color:#243449}input{width:min(360px,90vw)}button{cursor:pointer}button:hover{border-color:#218c8d;background:#edf7f6}a{color:#147c80}main{padding:24px 5vw}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.card{background:white;padding:16px;border:1px solid #dfe7ec;border-radius:10px;display:flex;flex-direction:column;gap:8px}.card img{width:100%;height:230px;object-fit:contain;background:white}.card h2{font-size:17px;margin:0}.meta{font-size:13px;color:#66778a}.flag{color:#9b5e26;background:#fff5e7;padding:7px;border-radius:5px}.ok{color:#217b74}.links{display:flex;gap:10px;flex-wrap:wrap}.count{margin-left:auto;align-self:center}.sr{position:absolute;left:-9999px}dialog{width:96vw;height:94vh;max-width:none;max-height:none;border:0;border-radius:12px;padding:0;background:#f0f3f5;color:#243449}dialog::backdrop{background:#14243dcc}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:white;border-bottom:1px solid #dbe3e9}.toolbar strong{margin-right:auto}.viewport{height:calc(94vh - 140px);overflow:auto;padding:20px;display:block}.viewport>img{display:block;margin:auto;max-width:100%;max-height:100%;object-fit:contain;background:white}.viewport.native>img{max-width:none;max-height:none;margin:0}.detail{padding:10px 20px;font-size:13px;background:white;min-height:50px}.components{display:grid;gap:20px}.component{background:white;padding:20px}.component img{display:block;max-width:100%;height:auto;margin:auto}.component h3{font-size:16px}.hidden{display:none}@media(max-width:650px){header{padding:24px}.toolbar{padding:10px}.viewport{height:calc(94vh - 190px)}.count{margin-left:0}}
</style>
<header><h1>图形复查与优选图库</h1><p>先浏览精修示例，再按数据结构选择。缩略总览、单图放大、目标尺寸筛查分别记录；任何状态都不代表科学结论成立。宽幅组合可展开独立面板，避免把多个面板压成一张小图。</p><p><a href="review-index.json">完整检查记录</a> · <a href="../design-v050/index.html">本次优选替代画法</a></p></header>
<nav><label><span class="sr">检索图形</span><input id="search" type="search" placeholder="按编号、图型或检查说明检索"></label><select id="filter" aria-label="筛选"><option value="preferred">优选与本次修正</option><option value="all">全部当前图形</option><option value="size">需要尺寸复核</option><option value="composition">组合图</option></select><span class="count" id="count" role="status"></span></nav><main><div id="grid" class="grid"></div></main>
<dialog id="viewer" aria-label="单图和面板检查"><div class="toolbar"><button id="previous" aria-label="上一张">←</button><button id="next" aria-label="下一张">→</button><strong id="title"></strong><button id="fit">适合窗口</button><button id="native">原像素放大</button><button id="parts">展开独立面板</button><button id="before">原版 / 修正版</button><button id="close">关闭</button></div><div id="viewport" class="viewport"></div><div class="detail" id="detail"></div></dialog>
<script>
'use strict';
const rows=/*REVIEW_ROWS*/[];
const $=id=>document.getElementById(id);let visible=[],active=null,original=false;
const local=p=>{if(typeof p!=='string'||!/^examples\/[A-Za-z0-9_./-]+$/.test(p)||p.includes('..'))throw Error('Unsafe public asset path');return '../../'+p};
const byId=new Map(rows.map(r=>[r.id,r]));
function img(path,label,lazy=true){const node=document.createElement('img');node.src=local(path);node.alt=label;if(lazy)node.loading='lazy';return node}
function link(path,label){const a=document.createElement('a');a.href=local(path);a.textContent=label;return a}
function refresh(){
 const q=$('search').value.toLowerCase(),filter=$('filter').value;
 visible=rows.filter(r=>(!q||[r.id,r.collection,r.visual_review?.note||''].join(' ').toLowerCase().includes(q))&&(filter==='all'||filter==='preferred'&&r.preferred||filter==='size'&&r.print_screen?.status==='REFLOW_OR_LARGER_FORMAT'||filter==='composition'&&r.components?.length));
 $('count').textContent=visible.length+' / '+rows.length+' 张';$('grid').replaceChildren();
 for(const r of visible){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=r.id+' · '+r.collection;card.append(h);const open=document.createElement('button');open.setAttribute('aria-label','检查 '+r.id);open.append(img(r.assets.png,r.id));open.onclick=()=>show(r);card.append(open);const status=document.createElement('div');status.className='meta';status.textContent=r.visual_review.status+' · '+r.visual_review.scope;card.append(status);
  const flag=document.createElement('div');const ps=r.print_screen;flag.className='meta '+(ps?.status==='REFLOW_OR_LARGER_FORMAT'?'flag':'ok');flag.textContent=ps?.at_target_p10_pt!=null?'178 mm宽下正文低分位字号约 '+ps.at_target_p10_pt+' pt；'+(ps.status==='REFLOW_OR_LARGER_FORMAT'?'建议重排 / 分面阅读':'仍需实际尺寸目检'):'尺寸筛查见回执；不代表视觉通过';card.append(flag);const links=document.createElement('div');links.className='links';for(const e of ['svg','pdf'])links.append(link(r.assets[e],e.toUpperCase()));card.append(links);$('grid').append(card)}
}
function show(r){active=r;original=false;$('viewer').showModal();paint()}
function paint(){const r=active;$('title').textContent=r.id+(original?' · 历史版':' · 当前版');$('viewport').className='viewport';$('viewport').replaceChildren(img(original&&r.previous_assets?r.previous_assets.png:r.assets.png,r.id,false));$('parts').disabled=!r.components?.length;$('before').disabled=!r.previous_assets;$('detail').textContent=r.visual_review.note+' 检查范围：'+r.visual_review.scope+'。总览不构成最终印刷验收。'}
$('fit').onclick=()=>$('viewport').classList.remove('native');$('native').onclick=()=>$('viewport').classList.add('native');$('close').onclick=()=>$('viewer').close();$('before').onclick=()=>{original=!original;paint()};
$('parts').onclick=()=>{const box=document.createElement('div');box.className='components';for(const id of active.components||[]){const r=byId.get(id);if(!r)continue;const item=document.createElement('section');item.className='component';const h=document.createElement('h3');h.textContent=id;item.append(h,img(r.assets.png,id));item.append(link(r.assets.svg,'打开独立矢量图'));box.append(item)}$('viewport').className='viewport';$('viewport').replaceChildren(box);$('detail').textContent='完整独立面板阅读视图；所有数据、单位和图例分别保留。页面显示不是论文最终拼版。'};
function move(delta){if(!visible.length)return;const at=visible.indexOf(active);active=visible[(at+delta+visible.length)%visible.length];original=false;paint()}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('viewer').addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});$('search').addEventListener('input',refresh);$('filter').addEventListener('change',refresh);refresh();
</script></html>
